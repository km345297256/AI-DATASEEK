user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Provider URLs carry short-lived bearer capabilities. Match the normalized
    # URI so percent-encoded path components cannot bypass log suppression.
    map $uri $office_access_loggable {
        default 1;
        ~*^/(api/v1/)?office-viewer(/|$) 0;
    }
    access_log  /var/log/nginx/access.log  main if=$office_access_loggable;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The Office origin must never acquire the anonymous administrator API,
    # including simple requests which do not trigger a CORS preflight.
    map $http_origin $office_origin_blocked {
        default 0;
        ~*^https?://office\.localhost\.*(?::[0-9]+)?$ 1;
        null 1;
    }
    map $http_referer $office_referrer_blocked {
        default 0;
        ~*^https?://office\.localhost\.*(?::[0-9]+)?/ 1;
    }

    # A separate browser origin on the SAME local frontend port. Path-only
    # isolation would let third-party editor scripts access the main app DOM.
    server {
        listen 80;
        server_name office.localhost;
        # Nginx normalizes trailing dots for virtual hosts; never issue the
        # document UI on that non-canonical browser origin.
        if ($http_host !~* ^office\.localhost(:[0-9]+)?$) { return 404; }
        access_log off;
        client_max_body_size 128k;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://office.localhost:* wss://office.localhost:*; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; form-action 'none'; base-uri 'self'; frame-ancestors http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:* http://office.localhost:* https://office.localhost:*" always;
        location /office-viewer/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $office_gateway http://office-gateway:8080;
            proxy_pass $office_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie '';
            proxy_set_header Authorization '';
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location / { return 404; }
    }

    server {
        listen       80 default_server;
        server_name  localhost;
        client_max_body_size 20G;
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # SDK modules and module workers must not inherit application/octet-stream
        # from older nginx MIME tables, nor fall back to the SPA on a missing asset.
        location ~ ^/(assets|visualization-assets)/.*\.mjs$ {
            root /usr/share/nginx/html;
            types { application/javascript mjs; }
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /visualization-assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Gateway-only bearer endpoints are not reachable on the public origin.
        location ^~ /api/v1/office-viewer/private/ { access_log off; return 404; }
        location /office-viewer/ { return 404; }
        location /api/ {
            if ($office_origin_blocked) { return 403; }
            if ($office_referrer_blocked) { return 403; }
            resolver 127.0.0.11 valid=10s;  # Docker DNS
            set $backend_url "${BACKEND_URL}";
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
