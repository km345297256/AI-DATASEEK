[project]
name = "ai-dataseek-sandbox"
version = "0.1.0"
description = "Isolated analysis sandbox for AI-DataSeek"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.121.2",
    "matplotlib>=3.9.2,<4.0",
    "numpy>=1.26.4,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "pandas>=2.2.3,<3.0",
    "pillow>=11.0.0,<13.0",
    "pip>=24.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "seaborn>=0.13.2,<0.14",
    "uvicorn>=0.38.0",
    "xlrd>=2.0.1,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "requests>=2.32.5",
]
