[project]
name = "ai-dataseek-sandbox"
version = "0.1.0"
description = "Isolated analysis sandbox for AI-DataSeek"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bottleneck>=1.4.2,<2.0",
    "cftime>=1.6.4,<2.0",
    "dask[array]>=2024.10.0,<2025.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.2",
    "geopandas>=1.0.1,<2.0",
    "h5py>=3.12.1,<4.0",
    "h5netcdf>=1.4.1,<2.0",
    "matplotlib>=3.9.2,<4.0",
    "netcdf4>=1.7.2,<2.0",
    "numpy>=1.26.4,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "pandas>=2.2.3,<3.0",
    "pillow>=11.0.0,<13.0",
    "pip>=24.3",
    "pyogrio>=0.10.0,<1.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyproj>=3.7.0,<4.0",
    "python-multipart>=0.0.20",
    "rarfile>=4.2,<5.0",
    "rasterio>=1.4.3,<2.0",
    "rioxarray>=0.17.0,<0.19",
    "scipy>=1.14.1,<2.0",
    "seaborn>=0.13.2,<0.14",
    "shapely>=2.0.6,<3.0",
    "uvicorn>=0.38.0",
    "xlrd>=2.0.1,<3.0",
    "xarray>=2024.10.0,<2025.0",
    "zarr>=2.18.3,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "requests>=2.32.5",
]
