name: ai-dataseek-dev

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev-stage
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${DEV_FRONTEND_PORT:-7100}:5173"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-dataseek-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      AUTH_PROVIDER: none
      SERVER_HOST: ${DEV_SERVER_HOST:-http://localhost:7100}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ai_dataseek_dev
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ai-dataseek-dev-files
      SANDBOX_ISOLATION: session
      SANDBOX_IMAGE: ai-dataseek-dev-sandbox:latest
      SANDBOX_NAME_PREFIX: ai-dataseek-dev-sandbox
      SANDBOX_NETWORK: ai-dataseek-dev-network
      DATASET_STORAGE_ROOT: /data/datasets
      DATASET_MANAGED_VOLUME: ai-dataseek-dev-dataset-data
      SKILLS_DIR: /app/skills
      USER_SKILLS_DIR: /data/skills/users
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - dataset-data:/data/datasets
      - skills-data:/data/skills
      - /app/__pycache__
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8001}:8000"
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - ai-dataseek-dev-network

  sandbox-image:
    image: ai-dataseek-dev-sandbox:latest
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    command: ["/bin/true"]
    restart: "no"
    networks:
      - ai-dataseek-dev-network

  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7.0}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "127.0.0.1:${DEV_MONGODB_PORT:-27018}:27017"
    restart: unless-stopped
    networks:
      - ai-dataseek-dev-network

  redis:
    image: ${REDIS_IMAGE:-redis:7.0}
    restart: unless-stopped
    networks:
      - ai-dataseek-dev-network

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-9011}:9001"
    restart: unless-stopped
    networks:
      - ai-dataseek-dev-network

volumes:
  mongodb-data:
    name: ai-dataseek-dev-mongodb-data
  minio-data:
    name: ai-dataseek-dev-minio-data
  dataset-data:
    name: ai-dataseek-dev-dataset-data
  skills-data:
    name: ai-dataseek-dev-skills-data

networks:
  ai-dataseek-dev-network:
    name: ai-dataseek-dev-network
    driver: bridge
